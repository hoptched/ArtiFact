# Single source of truth for the pipeline. Every stage reads this file;
# nothing hardcodes a model name, a size or a path.

corpus:
  source: artic              # artic | met — D2 normalizes both to one schema
  # D1 harvests every public-domain work with an image and a date (~59k) and
  # leaves type filtering to D2, so this cap and the type list below can
  # change without another 25-minute API walk.
  max_works: 10000           # cap on the corpus D2 emits, not on the harvest
  iiif_width: 400            # px requested from AIC's IIIF endpoint
  max_span_years: 100        # drop works whose date range is vaguer than this
  painting_like_only: true   # keep the corpus close to WikiArt's domain
  # What "painting-like" means, as AIC's artwork_type_title spells it.
  # Prints are AIC's largest public-domain category (~24.6k) but sit far
  # from WikiArt's painting domain, so they are out by default.
  painting_like_types:
    - Painting
    - Drawing and Watercolor
    - Miniature Painting
    - Print
  # Prints joined the corpus once the taxonomy could name them. D2
  # excluded them because the 17-class set was European oils and would
  # have called every woodblock "Ukiyo-e"; the 42-class set has Ukiyo-e at
  # 0.819, Japanese prints at 0.573 and Ink and wash at 0.812, three of
  # its strongest classes.
  #
  # Thinned, because printmaking is reproductive: one impression per
  # design, and no artist over the cap. AIC holds 1,529 Hiroshige prints
  # and 1,032 Whistlers, and without this the map becomes those two men.
  # The rule is uniform — capping only the Japanese material would have
  # left Whistler alone and called it balance.
  print_cap_per_artist: 150
  print_dedupe_title: true

model:
  # ViT-L/14 over ViT-B/32, measured on 20,224 works of Artificio/WikiArt
  # across 28 styles with artists held out:
  #   B/32   0.464 acc  0.429 macro F1    53 MB in the browser
  #   B/16   0.484      0.455             87 MB
  #   L/14   0.540      0.520            173 MB
  # A linear head stays: an MLP bought +1.3 accuracy for -0.6 macro F1,
  # which is buying the big classes with the small ones, and concatenating
  # B/32 onto L/14 was worse than L/14 alone.
  backbone: openai/clip-vit-large-patch14
  image_size: 224            # the backbone's native input
  batch_size: 64
  embed_dim: 768

taxonomy:
  # Decided 2026-09-22 over named_eras: ~10% of the corpus is Chinese,
  # Japanese, Indian, Tibetan or Iranian, and era names are Eurocentric.
  period_scheme: fifty_year_bins   # fifty_year_bins | named_eras
  unknown_label: Unknown

site:
  neighbors_per_work: 20     # top-k shipped to the browser instead of raw vectors
  max_bundle_mb: 10

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  site_data: web/public/data
