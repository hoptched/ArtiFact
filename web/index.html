<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Minerva</title>
    <!-- The Rembrandt's namesake, cropped to the helmet so the silhouette
         still reads at sixteen pixels. Relative, like every other asset
         here, so the site works from a subpath as well as from a root. -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Orpheus Pro is a commercial face and cannot be served from here.
         Cormorant Garamond is the closest free relative: the same
         delicate, high-contrast old-style serif with a display feel.
         To use real Orpheus, drop the woff2 into public/fonts/ and
         point --font-display at it in styles.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="9,101 works from the Art Institute of Chicago, mapped by period, place and style." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
